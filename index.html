<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>plentybans</title>
<meta name="description" content="plentybans. Stream on Spotify, SoundCloud, YouTube and Apple Music.">
<meta name="theme-color" content="#b9d3ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--mu:#5a6c86;--ink:#1e395b;--ln:#c7d5e8;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:linear-gradient(#b9d3ee,#dce8f6 260px,#e8eff8) fixed;color:#1e1e1e;font:15px/1.45 'Segoe UI','Open Sans',Tahoma,system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid #3b8de0;outline-offset:1px}
.wrap{max-width:720px;min-height:100vh;margin:0 auto;padding-bottom:72px;background:var(--bg);box-shadow:0 0 0 1px #8ca2c2,0 0 28px rgba(30,57,91,.35)}
.hero{position:relative;width:100%;max-width:500px;aspect-ratio:16/9;margin:0 auto;background:#0a0a0a;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.hero video,.hero .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.hero .poster{z-index:0}
.hero video{z-index:1}
.ttl{width:100%;max-width:500px;margin:0 auto;padding:10px 20px 12px;background:linear-gradient(rgba(255,255,255,.72),rgba(206,224,246,.64));border-top:1px solid rgba(255,255,255,.9)}
h1{font-size:clamp(36px,10vw,60px);font-weight:300;line-height:1.05;letter-spacing:-.02em;color:var(--ink);text-shadow:0 0 10px #fff,0 0 3px #fff}
.loc{margin-top:2px;font-size:14px;color:#33527a}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav{position:sticky;top:0;z-index:5;padding:8px 12px 0;background:linear-gradient(rgba(250,252,255,.96),rgba(214,228,245,.96));border-bottom:1px solid #9aabc4}
.chip{flex:none;height:32px;padding:0 18px;font-size:14px;color:var(--ink);border:1px solid #9aabc4;border-radius:3px;background:linear-gradient(#fbfcfe,#e3ebf6)}
.chip:hover{border-color:#6f9bd1;background:linear-gradient(#f4f9ff,#d4e5f9)}
nav .chip{border-bottom:0;border-radius:4px 4px 0 0}
.chip[aria-selected=true],.chip[aria-pressed=true]{border-color:#7da2ce;background:linear-gradient(#e6f0fc,#c4dbf6);box-shadow:inset 0 1px 0 #fff}
nav .chip[aria-selected=true]{background:#fff;color:#000;border-color:#9aabc4;box-shadow:none}
section{padding:0 8px}
section[hidden]{display:none}
#catalog .chips{margin:0 -8px 4px;padding:6px 8px;background:linear-gradient(#fdfeff,#eaf0f9);border-bottom:1px solid #d0dbea}
#catalog .chip{height:28px;padding:0 12px;border-color:transparent;background:none}
#catalog .chip:hover{border-color:#b6c9e4;background:linear-gradient(#fafcff,#e6eef9)}
#catalog .chip[aria-pressed=true]{border-color:#7da2ce;background:linear-gradient(#e0edfc,#c3dbf8)}
.sh{display:flex;align-items:center;gap:10px;padding:18px 8px 6px;font-size:17px;font-weight:400;color:var(--ink)}
.sh::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--ln),transparent)}
.row{display:flex;gap:12px;align-items:center;width:100%;padding:6px 8px;border:1px solid transparent;border-radius:3px;color:inherit;text-decoration:none}
.row:hover,.tr:hover{border-color:#c9dcf3;background:linear-gradient(#f9fcff,#e4effb)}
.row:active,.tr:active{border-color:#7da2ce;background:linear-gradient(#dcebfc,#bfd8f6)}
.cv{position:relative;width:48px;height:48px;border:1px solid #a9b9d0;border-radius:2px;background:#e9eef6;flex:none;overflow:hidden;box-shadow:0 1px 2px rgba(30,57,91,.25)}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.t{display:block}
.m{display:block;color:var(--mu);font-size:13px;overflow-wrap:anywhere}
.row svg,.row .lg{width:40px;height:40px;flex:none}
dialog{background:linear-gradient(#d6e5f7,#a9c6e6);color:#1e1e1e;border:1px solid #4f6f9a;border-radius:8px;padding:6px;width:min(92vw,420px);max-height:84vh;margin:auto;overflow:auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),0 14px 44px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(24,48,82,.5)}
.dp{padding:8px 8px 14px;background:#fff;border:1px solid #7f96b6;border-radius:3px}
.bar{display:flex;justify-content:space-between;min-height:40px}
.ib{width:38px;height:34px;font-size:22px;line-height:1;text-align:center;color:#33475f;border:1px solid #8b9bb2;border-radius:3px;background:linear-gradient(#fff,#dfe7f2)}
.ib:hover{border-color:#6f9bd1;background:linear-gradient(#f4f9ff,#cfe2f8)}
.ib[data-b]{width:36px;height:36px;padding-bottom:3px;font-size:26px;color:#fff;border-radius:50%;border-color:#1b4a8f;background:radial-gradient(circle at 50% 15%,#9cc6f3,#2d6fc8 55%,#1a4fa0);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 1px 2px rgba(0,0,0,.35)}
.ph{display:flex;gap:14px;align-items:center;padding:0 4px 10px}
.ph .cv{width:88px;height:88px}
.ph .t{font-size:22px;font-weight:400;line-height:1.15;color:var(--ink)}
.go{margin:0 4px 8px;height:30px;padding:0 16px;font-size:14px;border:1px solid #707070;border-radius:3px;background:linear-gradient(#f4f4f4 45%,#ebebeb 46%,#cfcfcf)}
.tr{display:flex;gap:14px;align-items:center;width:100%;padding:9px 8px;border:1px solid transparent;border-radius:3px}
.tr .n{display:inline-block;width:28px;flex:none;font-family:monospace;font-size:15px;font-weight:500;color:var(--mu);text-align:right}
</style>
</head>

const img=u=>u?`<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:'';
const fmt=d=>d?new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}):'';
const rowH=(x,a)=>`<button class="row" ${a}><span class="cv">${img(x.art)}</span><span><span class="t">${esc(x.t)}</span><span class="m">${esc(x.m)}</span></span></button>`;
const nk=s=>String(s||'').toLowerCase().replace(/\s*\((feat|ft)\b[^)]*\)/,'').replace(/[^a-z0-9]/g,'');
const spot=(p,t)=>{const a=SPA[nk(p.name)];return a&&a[t.n-1]?SP+'track/'+a[t.n-1]:'';};
const own=(t,art,apple,sp)=>({t,art,apple,sp,q:'plentybans '+t,own:1});
const one=p=>{const t=p.tracks[0];return own(t?t.t:p.name,p.art,t?t.url:p.url,t?spot(p,t):'');};

function link(it,k){
 if(k==='spotify'&&it.sp)return it.sp;
 const q=encodeURIComponent(it.q||('plentybans '+(it.t||'')));
 if(k==='apple')return it.apple||P.apple[1];
 if(k==='spotify')return 'https://open.spotify.com/search/'+q;
 if(k==='soundcloud')return 'https://soundcloud.com/search/sounds?q='+q;
 return it.own?YT+'/search?query='+encodeURIComponent(it.t):'https://www.youtube.com/results?search_query='+q;
}
const sheet=h=>{D.innerHTML='<div class="dp">'+h+'</div>';if(!D.open)D.showModal();};
const bar=b=>`<div class="bar">${b?'<button class="ib" data-b aria-label="Back">&lsaquo;</button>':'<span></span>'}<button class="ib" data-x aria-label="Close">&times;</button></div>`;
const head=(t,art,m)=>`<div class="ph"><span class="cv">${img(art)}</span><span><span class="t">${esc(t)}</span><span class="m">${esc(m)}</span></span></div>`;
function svc(it,back){
 sheet(bar(back)+head(it.t,it.art,'Listen on')+Object.keys(P).map(k=>`<a class="row" href="${esc(link(it,k))}" target="_blank" rel="noopener">${IC[k]}<span class="t">${P[k][0]}</span></a>`).join(''));
}
function proj(p){
 cur=p;
 const spAlbum=SPA_ALBUM[nk(p.name)];
 sheet(bar(0)+head(p.name,p.art,[p.type,p.d.slice(0,4)].filter(Boolean).join(' \u2022 '))+
  p.tracks.map((t,i)=>`<button class="tr" data-t="${i}"><span class="n">${i+1}</span><span class="t">${esc(t.t)}</span></button>`).join('')+
  (spAlbum?`<a class="row" style="margin-top:8px" href="${SP}album/${spAlbum}" target="_blank" rel="noopener">${IC.spotify}<span class="t">Open album on Spotify</span></a>`:''));
}

const BY={}; // optional forced artist under featuring title
function cat(){
 const yr=d=>(d||'').slice(0,4);
 let L=[...rel.map(p=>({k:'p',p,t:p.name,art:p.art,d:p.d,m:[yr(p.d),p.type].filter(Boolean).join(' \u2022 ')})),
  ...[...feat.filter(g=>!mv.some(f=>nk(f.t)===nk(g.t))),...mv].map(f=>({k:'f',f,t:f.t,art:f.art,d:f.d,m:[yr(f.d),BY[nk(f.t)]||f.by].filter(Boolean).join(' \u2022 ')}))]
  .sort((a,b)=>(b.d||'').localeCompare(a.d||''));
 if(F==='s')L=L.filter(x=>x.k==='p'&&x.p.type!=='Album');
 if(F==='a')L=L.filter(x=>x.k==='p'&&x.p.type==='Album');
 if(F==='f')L=L.filter(x=>x.k==='f');
 if(F==='v'){
  view=MVS.map((v,i)=>({k:'v',v,t:v.t,art:v.art,d:v.d,m:[v.by,v.d.slice(0,4)].filter(Boolean).join(' \u2022 ')}));
  $('#list').innerHTML=view.map((x,i)=>rowH(x,`data-c="${i}"`)).join('')||'<p class="m" style="padding:16px 8px">No music videos yet.</p>';
  return;
 }
 const G=F?[['',L]]:[['Albums',L.filter(x=>x.k==='p'&&x.p.type==='Album')],['Singles &amp; EPs',L.filter(x=>x.k==='p'&&x.p.type!=='Album')],['Featuring',L.filter(x=>x.k==='f')],['Music Videos',MVS.map(v=>({k:'v',v,t:v.t,art:v.art,d:v.d,m:[v.by,(v.d||'').slice(0,4)].filter(Boolean).join(' \u2022 ')}))]].filter(g=>g[1].length);
 view=G.flatMap(g=>g[1]);let i=0;
 $('#list').innerHTML=G.map(g=>(g[0]?`<h2 class="sh">${g[0]}</h2>`:'')+g[1].map(x=>rowH(x,`data-c="${i++}"`)).join('')).join('');
}
function all(){
 songs=rel.flatMap(p=>p.tracks.length?p.tracks.map(t=>({t:t.t,art:p.art,d:t.d||p.d,url:t.url,al:p.tracks.length>1?p.name:'',n:t.n,sp:spot(p,t)})):[{t:p.name,art:p.art,d:p.d,url:p.url,al:'',n:0}])
  .sort((a,b)=>(b.d||'').localeCompare(a.d||'')||a.n-b.n);
 $('#recent').innerHTML=songs.slice(0,8).map((s,i)=>rowH({t:s.t,art:s.art,m:[fmt(s.d),s.al].filter(Boolean).join(' \u2022 ')},`data-s="${i}"`)).join('');
 cat();
}
$('#links').innerHTML=Object.keys(P).map(k=>`<a class="row" href="${P[k][1]}" target="_blank" rel="noopener">${IC[k]}<span><span class="t">${P[k][0]}</span><span class="m">${esc(P[k][1].replace(/^https?:\/\//,''))}</span></span></a>`).join('');

document.addEventListener('click',e=>{
 const s=e.target.closest('[data-s]'),c=e.target.closest('[data-c]');
 if(s){const x=songs[s.dataset.s];svc(own(x.t,x.art,x.url,x.sp),0);}
 else if(c){
  const x=view[c.dataset.c];
  if(x.k==='v'){
    const v=x.v;
    sheet(bar(0)+head(v.t,'',v.by||'Music Video')+
      (v.yt?`<div style="position:relative;padding-bottom:56.25%;height:0;margin:8px 4px;border-radius:4px;overflow:hidden;background:#000"><iframe src="${esc(v.yt)}" title="${esc(v.t)}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`:'')+
      `<a class="row" href="${esc(v.url)}" target="_blank" rel="noopener">${IC.youtube}<span class="t">Open on YouTube</span></a>`);
  }
  else if(x.k==='f')svc({t:x.t,art:x.art,apple:x.f.url,q:(x.t.replace(/\s*\(feat[^)]*\)/i,'')+' '+(x.f.by||'')).trim(),own:0},0);
  else if(x.p.tracks.length>(x.p.type==='Album'?0:1))proj(x.p);
  else svc(one(x.p),0);
 }
});
D.addEventListener('click',e=>{
 const g=s=>e.target.closest(s);
 if(e.target===D||g('[data-x]'))D.close();
 else if(g('[data-b]'))proj(cur);
 else if(g('[data-t]')){const t=cur.tracks[g('[data-t]').dataset.t];svc(own(t.t,cur.art,t.url,spot(cur,t)),1);}
});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b));
 document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==b.dataset.tab);
});
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
 F=F===b.dataset.f?'':b.dataset.f;
 document.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.f===F));
 cat();
});

// Live catalog from Apple Music
window.__tr=r=>{
 const m={};
 (r.results||[]).forEach(x=>{
  if(x.wrapperType!=='track'||x.kind!=='song')return;
  if(FX.includes(x.collectionId)){
   mv.push({t:x.trackName,by:x.artistName,d:x.releaseDate||'',art:(x.artworkUrl100||'').replace('100x100bb','600x600bb'),url:x.trackViewUrl});
   return;
  }
  const an=(x.artistName||'').toLowerCase();
  // skip pure features from other artists that slipped in
  if(!an.includes('plentybans') && !/(feat\.?\s*plentybans)/i.test(x.trackName||'')){
   // still allow if collection is primary
  }
  const nm=x.collectionName||'';
  const p=m[x.collectionId]||(m[x.collectionId]={id:x.collectionId,name:nm.replace(/ - (Single|EP)$/,''),type:/ - Single$/.test(nm)?'Single':/ - EP$/.test(nm)?'EP':'Album',d:x.releaseDate||'',art:(x.artworkUrl100||'').replace('100x100bb','600x600bb'),url:x.collectionViewUrl||AB+x.collectionId,tracks:[]});
  p.tracks.push({t:x.trackName,n:x.trackNumber||0,url:x.trackViewUrl,d:x.releaseDate||''});
 });
 const a=Object.values(m).filter(p=>{
  // drop albums that are clearly other artists' projects if only 1 track and not named after plentybans content
  return true;
 });
 if(a.length){a.forEach(p=>p.tracks.sort((x,y)=>x.n-y.n));rel=a;all();}
};
window.__fe=r=>{
 const n=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''),m=new Map();
 (r.results||[]).forEach(x=>{
  if(x.wrapperType==='track'&&x.kind==='song'&&x.artistId!==AID&&n(x.artistName)!=='plentybans'&&n(x.trackName+x.artistName).includes('plentybans'))
   m.set(x.trackId,{t:x.trackName,by:x.artistName,d:x.releaseDate||'',art:(x.artworkUrl100||'').replace('100x100bb','600x600bb'),url:x.trackViewUrl});
 });
 if(m.size){feat=[...m.values()];cat();}
};
const jp=u=>{const s=document.createElement('script');s.src=u;document.head.append(s);};
jp(`https://itunes.apple.com/lookup?id=${AID}&entity=song&limit=200&callback=__tr`);
jp('https://itunes.apple.com/search?term=plentybans&entity=song&limit=200&callback=__fe');
all();


</script>
</body>
</html>
